<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home</title>
    <link rel="stylesheet" href="hmepage.css" />
  </head>
  <body>
    <div class="Camera">
      <div class="Menu" id="menu">
        <img src="close-outline.svg" alt="Cancel" />
        <div class="Sounds">
          <img src="musical-notes-outline.svg" alt="Music" />
          <h4>Sounds</h4>
        </div>
      </div>
      <div class="SideMenu" id="sideMenu">
        <img src="camera-reverse-outline.svg" alt="Camera" />
        <h4>Flip</h4>
        <img src="speedometer-outline.svg" alt="Speed" />
        <h4>Speed</h4>
        <img src="" alt="Mode" />
        <h4>Beauty</h4>
        <img src="color-filter-outline.svg" alt="Filter" />
        <h4>Filters</h4>
        <img src="stopwatch-outline.svg" alt="Timer" />
        <h4>Timer</h4>
        <img src="flash-off-outline.svg" alt="Flash" />
        <h4>Flash</h4>
      </div>
      <div class="BottomMenu" id="bottomMenu">
        <div class="Effects">
          <img src="person-circle-outline.svg" alt="Effects" />
          <h4>Effects</h4>
        </div>
        <div class="Record">
          <div class="InnerCircle"></div>
        </div>
        <div class="Upload">
          <img src="square (1).svg" alt="Upload" />
          <h4>Upload</h4>
        </div>
      </div>
      <div class="BottomMenu2" id="bottomMenu2">
        <h6>60s</h6>
        <h6 id="timer15s">15s</h6>
        <h6>Templates</h6>
      </div>
    </div>
  </body>
</html>
